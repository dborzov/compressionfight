{{ $g := partial "gameroot.html" . }}
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/{{ site.Params.katexVersion }}/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/{{ site.Params.katexVersion }}/contrib/auto-render.min.js"></script>
<script>
(function () {
  var GAME = {{ $g }};
  var btn = document.querySelector('.menu-btn');
  if (btn) btn.addEventListener('click', function () {
    var open = document.body.classList.toggle('menu-open');
    btn.setAttribute('aria-expanded', String(open));
  });
  // KaTeX
  function math() {
    if (!window.renderMathInElement) return false;
    renderMathInElement(document.getElementById('main'), {
      delimiters: [{left: '$$', right: '$$', display: true}, {left: '\\[', right: '\\]', display: true},
                   {left: '$', right: '$', display: false}, {left: '\\(', right: '\\)', display: false}],
      ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'], throwOnError: false });
    return true;
  }
  window.addEventListener('load', function () { math(); });
  // copy buttons on code blocks
  document.querySelectorAll('.highlight').forEach(function (h) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'copy'; b.textContent = 'COPY';
    b.addEventListener('click', function () {
      var t = h.querySelector('code'); if (!t || !navigator.clipboard) return;
      navigator.clipboard.writeText(t.innerText).then(function () { b.textContent = 'COPIED'; setTimeout(function () { b.textContent = 'COPY'; }, 1500); });
    });
    h.appendChild(b);
  });
  // Labs: reuse the game's own demos
  var labs = document.querySelectorAll('.map-lab');
  if (!labs.length) return;
  function load(src) { return new Promise(function (ok, bad) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = function () { bad(new Error(src)); }; document.head.appendChild(s); }); }
  load(GAME + 'js/data.js').then(function () { return load(GAME + 'js/demos.js'); }).then(function () {
    labs.forEach(function (el) {
      var id = el.getAttribute('data-fighter');
      try {
        var f = window.CYC && CYC.byId && CYC.byId[id];
        var t = document.createElement('div'); t.className = 'lab-title';
        t.textContent = 'SPECIAL MOVE LAB' + (f ? ' · ' + f.name : '');
        el.textContent = ''; el.appendChild(t);
        var box = document.createElement('div'); box.className = 'lab-body'; el.appendChild(box);
        if (!CYC.Demos.has || !CYC.Demos.has(id)) throw new Error('no lab for ' + id);
        CYC.Demos.render(box, id);
      } catch (e) {
        el.innerHTML = '<p class="lab-fail">The interactive lab for "' + id + '" could not start. You can try it in <a href="' + GAME + '#fighter=' + id + '">the game</a>.</p>';
        console.warn('lab failed', id, e);
      }
    });
  }).catch(function (e) {
    labs.forEach(function (el) { el.innerHTML = '<p class="lab-fail">The interactive labs could not be loaded. Try them in <a href="' + GAME + '">the game</a>.</p>'; });
    console.warn('labs unavailable', e);
  });
})();
</script>
