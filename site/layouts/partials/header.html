{{ $g := partial "gameroot.html" . }}
<header class="top">
  <button class="menu-btn" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Toggle the map menu">Menu</button>
  <a class="wordmark" href="{{ $g }}" aria-label="Choose Your Codec: back to the game">Choose Your Codec</a>
  <nav class="topnav" aria-label="Site">
    <a href="{{ "" | absURL }}"{{ if .IsHome }} aria-current="page"{{ end }}>Map</a>
    <a href="{{ "primer/" | absURL }}"{{ if eq .RelPermalink ("primer/" | relURL) }} aria-current="page"{{ end }}>Primer</a>
    <a class="play" href="{{ $g }}">Play the game</a>
  </nav>
</header>
