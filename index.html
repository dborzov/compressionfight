<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Choose your codec</title>
<meta name="description" content="A game about data compression: pick a task, read its requirements, assemble the codec pipeline stage by stage, and watch the data change.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23f3eadb'/><text x='16' y='24' font-size='22' text-anchor='middle' fill='%23b8892e' font-family='serif'>❦</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="topbar">
  <button id="btn-home" class="logo" type="button" aria-label="Choose your codec: title screen">Choose your codec</button>
  <nav id="mode-toggle" class="mode-toggle" aria-label="Mode">
    <button id="mode-heist" type="button" class="mode-btn is-on" aria-pressed="true">Build</button>
    <button id="mode-explore" type="button" class="mode-btn" aria-pressed="false">Explore</button>
  </nav>
  <a id="btn-map" class="mode-btn map-btn" href="map/">Map</a>
  <button id="btn-fixer" type="button" class="fixer-toggle is-on" aria-pressed="true">Tutor: on</button>
  <div id="topbar-status" class="topbar-status" aria-live="polite"></div>
</header>

<main id="app">
  <!-- TITLE -->
  <section id="screen-title" class="screen screen-title rule-2 ornate">
    <p class="title-tag eyebrow eyebrow-lg">A game about data compression</p>
    <h1 class="title-logo">Choose your codec</h1>
    <div class="fleuron title-rule" aria-hidden="true">❦</div>
    <p class="title-sub">Pick a compression task, read its requirements, assemble the pipeline stage by stage, and watch the data change.</p>
    <button id="btn-start" type="button" class="btn btn-huge btn-run">Start</button>
    <button id="btn-title-explore" type="button" class="btn btn-ghost">Explore the algorithms</button>
    <p id="title-engine-note" class="engine-note" hidden></p>
  </section>

  <!-- LEVEL SELECT -->
  <section id="screen-levels" class="screen" hidden>
    <div class="screen-head">
      <h2 class="h-display">Select level</h2>
      <div class="head-actions">
        <button id="btn-unlock-all" type="button" class="btn btn-small">Unlock everything</button>
        <button id="btn-reset-progress" type="button" class="btn btn-small btn-ghost">Reset progress</button>
      </div>
    </div>
    <div id="level-grid" class="level-grid"></div>
  </section>

  <!-- TASK SELECT: tasks / exercises / lessons -->
  <section id="screen-heists" class="screen" hidden>
    <div class="screen-head">
      <button id="btn-back-levels" type="button" class="btn btn-small btn-ghost">&larr; Levels</button>
      <h2 id="heists-title" class="h-display">Select task</h2>
    </div>
    <p id="heists-tagline" class="tagline"></p>
    <div id="heists-subtabs" class="tabs tabs-sub" role="tablist" aria-label="Level sections">
      <button id="htab-heists" type="button" class="tab is-on" role="tab" aria-selected="true" data-tab="heists">Tasks</button>
      <button id="htab-quests" type="button" class="tab" role="tab" aria-selected="false" data-tab="quests">Exercises</button>
      <button id="htab-notebook" type="button" class="tab" role="tab" aria-selected="false" data-tab="notebook">Lessons</button>
    </div>
    <div id="heists-body" class="heists-body" role="tabpanel"></div>
  </section>

  <!-- PIPELINE BUILDER -->
  <section id="screen-squad" class="screen" hidden>
    <div class="screen-head">
      <button id="btn-back-heists" type="button" class="btn btn-small btn-ghost">&larr; Back</button>
      <h2 id="squad-title" class="h-display">Pipeline builder</h2>
    </div>
    <div id="squad-job" class="job-sheet ornate"></div>
    <div id="chair-row" class="chair-row"></div>
    <div id="combo-bar" class="combo-bar" aria-live="polite"></div>
    <div class="run-bar">
      <button id="btn-run" type="button" class="btn btn-huge btn-run">Run the pipeline</button>
    </div>
    <section id="pipeline" class="pipeline" aria-label="Live pipeline"></section>
    <div class="run-bar run-bar-bottom">
      <button id="btn-run-2" type="button" class="btn btn-big btn-run">Run the pipeline</button>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="screen-results" class="screen" hidden>
    <div id="results" class="results"></div>
  </section>

  <!-- CHECKPOINT QUIZ -->
  <section id="screen-quiz" class="screen" hidden>
    <div id="quiz" class="quiz"></div>
  </section>

  <!-- EXERCISE -->
  <section id="screen-quest" class="screen" hidden>
    <div id="quest" class="quest"></div>
  </section>

  <!-- EXPLORE -->
  <section id="screen-explore" class="screen" hidden>
    <div class="screen-head">
      <h2 class="h-display">Explore</h2>
      <div id="explore-tabs" class="tabs" role="tablist" aria-label="Explore sections">
        <button id="tab-codecs" type="button" class="tab is-on" role="tab" aria-selected="true" data-tab="codecs">Codecs</button>
        <button id="tab-roster" type="button" class="tab" role="tab" aria-selected="false" data-tab="roster">Algorithms</button>
        <button id="tab-jobs" type="button" class="tab" role="tab" aria-selected="false" data-tab="jobs">Tasks</button>
        <button id="tab-matrix" type="button" class="tab" role="tab" aria-selected="false" data-tab="matrix">Matrix</button>
        <button id="tab-duel" type="button" class="tab" role="tab" aria-selected="false" data-tab="duel">Compare</button>
        <button id="tab-tradeoffs" type="button" class="tab" role="tab" aria-selected="false" data-tab="tradeoffs">Trade-offs</button>
      </div>
    </div>
    <div id="explore-body" class="explore-body" role="tabpanel"></div>
  </section>
</main>

<!-- TUTOR box -->
<aside id="fixer" class="fixer ornate" hidden aria-live="polite" aria-label="Tutor">
  <div class="fixer-portrait portrait" style="--rc:var(--line)" aria-hidden="true">
    <span class="initials">T</span>
    <img alt="" src="img/fighters/none.png" onerror="this.remove()">
  </div>
  <div class="fixer-body">
    <div class="fixer-name"><span id="fixer-name">Tutor</span><span id="fixer-count" class="fixer-count"></span></div>
    <p id="fixer-text" class="fixer-text"></p>
    <div class="fixer-actions">
      <button id="btn-fixer-next" type="button" class="btn btn-small">Next</button>
      <button id="btn-fixer-close" type="button" class="btn btn-small btn-ghost" aria-label="Dismiss the tutor">&times;</button>
    </div>
  </div>
</aside>

<!-- CHOOSE AN ALGORITHM -->
<div id="overlay-fighter" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="fighter-overlay-title">
  <div class="overlay-box">
    <div class="overlay-head">
      <h2 id="fighter-overlay-title" class="h-display">Choose an algorithm</h2>
      <div id="fighter-overlay-role" class="overlay-role"></div>
      <button id="btn-close-fighter" type="button" class="btn btn-small" aria-label="Close">Done</button>
    </div>
    <div class="chooser">
      <aside id="family-col" class="family-col" aria-label="Families"></aside>
      <div id="fighter-grid" class="fighter-grid" aria-label="Algorithms"></div>
      <aside id="fighter-detail" class="detail-col" aria-live="polite"></aside>
    </div>
  </div>
</div>

<!-- ALGORITHM DETAIL (Explore) -->
<div id="overlay-detail" class="overlay" hidden role="dialog" aria-modal="true" aria-label="Algorithm details">
  <div class="overlay-box overlay-box-narrow">
    <div class="overlay-head">
      <h2 class="h-display">Algorithm</h2>
      <button id="btn-close-detail" type="button" class="btn btn-small" aria-label="Close">Close</button>
    </div>
    <div id="detail-body" class="detail-body"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/curriculum.js"></script>
<script src="js/quests_data.js"></script>
<script src="js/engine.js"></script>
<script src="js/rules.js"></script>
<script src="js/demos.js"></script>
<script src="js/quests.js"></script>
<script src="js/viz.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
